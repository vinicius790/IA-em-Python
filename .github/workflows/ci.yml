name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Análise estática e linting
        run: |
          ruff check .
          ruff format --check .
          mypy

      - name: Executar testes automatizados (pytest)
        run: |
          pytest -v --cov --cov-report=term-missing

      - name: Testes de tracing com o extra `otel` (OpenTelemetry)
        run: |
          pip install -e ".[dev,otel]"
          pytest -v tests/test_tracing.py tests/test_tracing_noop.py

      - name: Validar CLI Avançada (Explicabilidade, K-Fold, Drift, Auditoria)
        run: |
          iris-ai models
          iris-ai quality
          iris-ai drift-check --shift 0.8
          iris-ai explain-pipeline --model logistic_regression --repeats 3
          iris-ai kfold --model logistic_regression --folds 3
          iris-ai audit-export --model logistic_regression --format markdown --output artifacts/model_audit_ci.md
          iris-ai audit-export --model logistic_regression --format json --output artifacts/model_audit_ci.json

      - name: Smoke test contra a API em execução
        run: |
          uvicorn app.main:app --port 8000 &
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          python scripts/smoke_test.py http://127.0.0.1:8000

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validar Dockerfile Multi-Stage
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: iris-ai-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

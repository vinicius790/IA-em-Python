[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "iris-ai-platform"
dynamic = ["version"]
description = "Plataforma didática de ML/MLOps sobre o dataset Iris: treino, registry, monitoramento e API"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Iris AI Platform contributors"}]
license = {text = "MIT"}
keywords = ["machine-learning", "mlops", "fastapi", "scikit-learn", "xgboost", "model-registry"]
dependencies = [
  "fastapi>=0.141,<0.158",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "SQLAlchemy>=2.0.54,<2.2",
  "alembic>=1.20,<2",
  "pandas>=2.2,<4",
  "numpy>=2.0,<3",
  "scikit-learn>=1.9,<1.10",
  "xgboost>=3.4,<3.5",
  "joblib>=1.5,<2",
  "prometheus-client>=0.26,<1",
  "structlog>=26,<27",
  "typer>=0.16,<1",
  "rich>=14,<16",
]

[project.optional-dependencies]
# Busca de hiperparâmetros do XGBoost com Optuna (sem ele, usa RandomizedSearchCV).
tuning = ["optuna>=4,<6"]
# Modelos extras `lightgbm` e `catboost` no catálogo.
boosters = ["lightgbm>=4.5,<5", "catboost>=1.2,<2"]
# Envio das execuções de treino a um servidor MLflow (MLFLOW_TRACKING_URI).
tracking = ["mlflow>=3,<4"]
# Exportação ONNX e inferência com onnxruntime (backend por versão no registry).
onnx = ["skl2onnx>=1.17,<2", "onnxruntime>=1.18,<2"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
dev = [
  "httpx2>=2.13,<3",
  "hypothesis>=6.100,<7",
  "mypy>=1.10,<2",
  "pandas-stubs>=2.2",
  "pytest>=9,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.16,<1",
]

[project.scripts]
iris-ai = "app.cli:app"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "alembic.ini"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: `Depends(...)`/`typer.Option(...)` em valores padrão é o idioma do FastAPI e do Typer.
# E501: o comprimento de linha fica a cargo do `ruff format`.
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Sem cache do pytest: os testes não gravam nada dentro do repositório.
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:app"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Piso de cobertura do CI: só pode subir.
fail_under = 90

[tool.mypy]
# Strict gradual: adicione pacotes aqui à medida que forem tipados.
files = ["app/platform", "app/monitoring"]
strict = true
ignore_missing_imports = true
